name: Release candidate

on:
  workflow_dispatch:
    inputs:
      windows-signing:
        type: choice
        options: [authenticode, unsigned-pilot]
        default: authenticode
      unsigned-pilot-reason:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  candidate:
    needs: quality
    if: github.ref == 'refs/heads/master'
    runs-on: windows-2025
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17.0.20.1+1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 25.0.4.1+1
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-35 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-disabled: true
      - name: Install pinned WiX and extensions
        shell: pwsh
        run: |
          $toolPath = Join-Path $env:RUNNER_TEMP 'securelan-wix'
          dotnet tool install --tool-path $toolPath wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed.' }
          & (Join-Path $toolPath 'wix.exe') extension add --global WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX UI extension installation failed.' }
          & (Join-Path $toolPath 'wix.exe') extension add --global WixToolset.Util.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX Util extension installation failed.' }
          $toolPath | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build and verify the production candidate
        shell: pwsh
        env:
          ANDROID_RELEASE_STORE_BASE64: ${{ secrets.ANDROID_RELEASE_STORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
          ANDROID_PREVIOUS_VERSION_CODE: ${{ vars.ANDROID_PREVIOUS_VERSION_CODE }}
          SECURELAN_VERIFY_RELEASE_TOOLCHAIN: 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $env:ANDROID_RELEASE_STORE_FILE = Join-Path $env:RUNNER_TEMP 'securelan-release.jks'
          try {
            if (!$env:ANDROID_RELEASE_STORE_BASE64) { throw 'Production Android keystore is required.' }
            [IO.File]::WriteAllBytes($env:ANDROID_RELEASE_STORE_FILE, [Convert]::FromBase64String($env:ANDROID_RELEASE_STORE_BASE64))
            .\gradlew.bat :apps:android-client:productionApk :apps:desktop-client:buildPortable :apps:desktop-client:buildExe writeToolchainManifest --no-configuration-cache --no-build-cache --dependency-verification=strict --console=plain
            if ($LASTEXITCODE -ne 0) { throw 'Production build failed.' }
          } finally {
            if (Test-Path -LiteralPath $env:ANDROID_RELEASE_STORE_FILE) { Remove-Item -LiteralPath $env:ANDROID_RELEASE_STORE_FILE -Force }
          }
      - name: Sign installer or designate the unsigned pilot
        shell: pwsh
        env:
          WINDOWS_SIGNING_POLICY: ${{ inputs.windows-signing }}
          WINDOWS_UNSIGNED_PILOT_REASON: ${{ inputs.unsigned-pilot-reason }}
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_CERT_SHA256: ${{ vars.WINDOWS_CERT_SHA256 }}
        run: ./scripts/sign_windows.ps1
      - name: Stage only this run's artifacts
        shell: pwsh
        env:
          WINDOWS_SIGNING_POLICY: ${{ inputs.windows-signing }}
          WINDOWS_UNSIGNED_PILOT_REASON: ${{ inputs.unsigned-pilot-reason }}
        run: |
          New-Item -ItemType Directory -Path candidate | Out-Null
          Copy-Item apps/desktop-client/build/distributions/*-windows-x86_64-portable.zip candidate/
          Copy-Item apps/desktop-client/build/packaging/installers/*.exe candidate/
          Copy-Item apps/android-client/build/distributions/apk/release/*.apk candidate/
          Copy-Item apps/android-client/build/reports/release/android-signature.json candidate/
          $version = (Select-String -Path gradle.properties -Pattern '^secureLanVersion=(.+)$').Matches.Groups[1].Value
          python scripts/release.py manifest --directory candidate --commit $env:GITHUB_SHA --version $version --target windows-x86_64+android --toolchain apps/desktop-client/build/reports/release/toolchain.json
          if ($LASTEXITCODE -ne 0) { throw 'Candidate manifest failed.' }
          @{ policy = $env:WINDOWS_SIGNING_POLICY; reason = $env:WINDOWS_UNSIGNED_PILOT_REASON } | ConvertTo-Json | Set-Content -Encoding utf8 candidate/windows-signing.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 30
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-reports
          retention-days: 14
          path: |
            **/build/reports/
            **/build/test-results/
