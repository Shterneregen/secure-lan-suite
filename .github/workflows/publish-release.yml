name: Publish qualified release

on:
  workflow_dispatch:
    inputs:
      candidate-run:
        description: Successful Release candidate run ID for this exact master commit
        type: string
        required: true
      qualification-json:
        description: Completed device/install qualification JSON bound to candidate SHA-256 hashes
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-2025
    environment: production
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17.0.20.1+1
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-35 build-tools;36.0.0'
      - name: Verify candidate origin, bytes and manual qualification, then publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate-run }}
          QUALIFICATION_JSON: ${{ inputs.qualification-json }}
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
          ANDROID_PREVIOUS_VERSION_CODE: ${{ vars.ANDROID_PREVIOUS_VERSION_CODE }}
        run: python scripts/publish_release.py
