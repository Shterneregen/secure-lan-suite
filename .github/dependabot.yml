version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      kotlin-plugins:
        patterns:
          - org.jetbrains.kotlin.jvm
          - org.jetbrains.kotlin.plugin.compose
    ignore:
      # Newer Core versions require a compileSdk upgrade from Android 35.
      - dependency-name: androidx.core:core-ktx
        versions: ['>1.15.0']
