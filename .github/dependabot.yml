version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      junit:
        patterns:
          - org.junit.jupiter:*
          - org.junit.vintage:*
          - org.junit.platform:*
          - org.junit:*
      kotlin-plugins:
        patterns:
          - org.jetbrains.kotlin.jvm
          - org.jetbrains.kotlin.plugin.compose
    ignore:
      # Review Core separately from the Compose/toolchain update.
      - dependency-name: androidx.core:core-ktx
        versions: ['>1.15.0']
