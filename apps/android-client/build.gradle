tasks.register('validateProductionSigning') {
    group = 'verification'
    description = 'Reject missing production credentials and an unspecified expected certificate.'
    doLast {
        if (!hasReleaseSigningConfig) {
            throw new GradleException('Production APK requires all four Android release signing values.')
        }
        if (!(System.getenv('ANDROID_RELEASE_CERT_SHA256')?.replace(':', '') ==~ /(?i)[0-9a-f]{64}/)) {
            throw new GradleException('Set ANDROID_RELEASE_CERT_SHA256 to the independently trusted production certificate fingerprint.')
        }
    }
}

def androidSdkDirectory = androidComponents.sdkComponents.sdkDirectory
tasks.register('verifyProductionApk', Exec) {
    group = 'verification'
    dependsOn tasks.named('validateProductionSigning'), tasks.named('assembleRelease')
    doFirst {
        commandLine 'python', rootProject.file('scripts/release.py'), 'verify-apk',
                '--apk', layout.buildDirectory.file("distributions/apk/release/secure-lan-${appVersion}.apk").get().asFile,
                '--sdk', androidSdkDirectory.get().asFile, '--version', appVersion, '--version-code', appVersionCode.toString(),
                '--output', layout.buildDirectory.file('reports/release/android-signature.json').get().asFile
    }
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    mustRunAfter tasks.named('validateProductionSigning')
}

tasks.register('productionApk') {
    group = 'distribution'
    description = 'Build a production APK only after quality checks and verification of the final certificate and identity.'
    dependsOn rootProject.tasks.named('releaseGate'), tasks.named('verifyProductionApk')
}

apply from: rootProject.file('gradle/notices.gradle')
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    variant.sources.assets.addGeneratedSourceDirectory(tasks.named('generateThirdPartyNotices'), { it.noticeDirectory })
}
