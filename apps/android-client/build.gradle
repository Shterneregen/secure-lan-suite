import com.android.build.api.artifact.SingleArtifact

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

configurations {
    kotlinLint {
        canBeConsumed = false
        canBeResolved = true
    }
}

def kotlinLintSources = fileTree('src') { include '**/*.kt' }

tasks.register('lintKotlin', JavaExec) {
    group = 'verification'
    description = 'Check Android Kotlin source hygiene and KDoc placement with ktlint.'
    classpath = configurations.kotlinLint
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    mainClass = 'com.pinterest.ktlint.Main'
    inputs.files(kotlinLintSources)
    inputs.file('.editorconfig')
    workingDir = projectDir
    args 'src/**/*.kt'
}

tasks.register('formatKotlin', JavaExec) {
    group = 'formatting'
    description = 'Fix Android Kotlin source hygiene with ktlint.'
    classpath = configurations.kotlinLint
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    mainClass = 'com.pinterest.ktlint.Main'
    workingDir = projectDir
    args '--format', 'src/**/*.kt'
}

tasks.named('check') { dependsOn tasks.named('lintKotlin') }

def releaseStoreFilePath = findProperty('android.release.storeFile') ?: System.getenv('ANDROID_RELEASE_STORE_FILE')
def releaseStorePassword = findProperty('android.release.storePassword') ?: System.getenv('ANDROID_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = findProperty('android.release.keyAlias') ?: System.getenv('ANDROID_RELEASE_KEY_ALIAS')
def releaseKeyPassword = findProperty('android.release.keyPassword') ?: System.getenv('ANDROID_RELEASE_KEY_PASSWORD')
def hasReleaseSigningConfig = releaseStoreFilePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

def appVersion = project.version.toString().replaceAll(/-SNAPSHOT$/, '')
def versionParts = appVersion.tokenize('.')
if (!(appVersion ==~ /\d{1,3}\.\d{1,3}\.\d{1,3}/)) {
    throw new GradleException('secureLanVersion must use major.minor.patch, with components from 0 to 999.')
}
def derivedVersionCode = versionParts[0].toInteger() * 1000000 +
        versionParts[1].toInteger() * 1000 + versionParts[2].toInteger()
def appVersionCode = providers.gradleProperty('androidVersionCode').map { it.toInteger() }
        .getOrElse(derivedVersionCode)
if (appVersionCode < 1 || appVersionCode > 2100000000) {
    throw new GradleException('androidVersionCode must be between 1 and 2100000000.')
}

android {
    namespace = 'com.shterneregen.securelan.androidclient'
    compileSdk = 35

    bundle {
        language {
            enableSplit = false
        }
    }

    defaultConfig {
        applicationId = 'com.shterneregen.securelan.androidclient'
        minSdk = 26
        targetSdk = 35
        versionCode = appVersionCode
        versionName = appVersion

        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    signingConfigs {
        release {
            if (hasReleaseSigningConfig) {
                storeFile = file(releaseStoreFilePath)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasReleaseSigningConfig ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain(17)
}

// Export named APKs without changing AGP's install metadata or using legacy APIs.
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def variantTaskSuffix = variant.name.capitalize()
    def exportApk = tasks.register("export${variantTaskSuffix}Apk", Sync) {
        group = 'distribution'
        description = "Export the ${variant.name} APK with the application version in its filename."
        from(variant.artifacts.get(SingleArtifact.APK.INSTANCE)) {
            include '*.apk'
            rename { "secure-lan-${appVersion}.apk" }
        }
        into(layout.buildDirectory.dir("distributions/apk/${variant.name}"))
    }
    tasks.matching { it.name == "assemble${variantTaskSuffix}" }.configureEach {
        dependsOn exportApk
    }
}

dependencies {
    kotlinLint 'com.pinterest.ktlint:ktlint-cli:1.7.1'
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    androidTestImplementation composeBom

