import static java.io.File.pathSeparator

import org.gradle.api.file.DuplicatesStrategy

import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.util.zip.ZipFile

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.8.2'
    }
}

plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.compose'
    id 'application'
}

def composeMainClass = 'com.shterneregen.securelan.desktop.compose.ComposeDesktopMainKt'

application {
    mainClass = composeMainClass
    applicationDefaultJvmArgs = [
            '--enable-native-access=ALL-UNNAMED'
    ]
}

tasks.named('run') {
    dependsOn ':modules:webrtc-core:verifyNativePlatform'
}

configurations {
    kotlinLint {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    kotlinLint 'com.pinterest.ktlint:ktlint-cli:1.7.1'
    implementation project(':modules:common-model')
    implementation project(':modules:common-net')
    implementation project(':modules:crypto-core')
    implementation project(':modules:chat-core')
    implementation project(':modules:file-transfer-core')
    implementation project(':modules:webcam-core')
    implementation project(':modules:audio-core')
    implementation project(':modules:webrtc-core')
    implementation project(':modules:stego-core')
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.formdev:flatlaf:3.7.1'
    implementation compose.desktop.currentOs
    implementation 'org.jetbrains.compose.material:material-icons-core-desktop:1.7.3'
}

def kotlinLintSources = fileTree('src') {
    include '**/*.kt'
    // Checked-in upstream Material icons retain their original generated style.
    exclude 'main/kotlin/androidx/**'
}

tasks.register('lintKotlin', JavaExec) {
    group = 'verification'
    description = 'Check desktop Kotlin source hygiene and KDoc placement with ktlint.'
    classpath = configurations.kotlinLint
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    mainClass = 'com.pinterest.ktlint.Main'
    inputs.files(kotlinLintSources)
    inputs.file('.editorconfig')
    workingDir = projectDir
    args 'src/**/*.kt', '!src/main/kotlin/androidx/**'
}

tasks.register('formatKotlin', JavaExec) {
    group = 'formatting'
    description = 'Fix desktop Kotlin source hygiene with ktlint.'
    classpath = configurations.kotlinLint
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    mainClass = 'com.pinterest.ktlint.Main'
    workingDir = projectDir
    args '--format', 'src/**/*.kt', '!src/main/kotlin/androidx/**'
}

tasks.named('check') {
    dependsOn tasks.named('lintKotlin')
}

def appName = 'SecureLanSuite'
def appRuntimeModules = [
        'java.base',
        'java.desktop',
        'java.instrument',
        'java.logging',
        'jdk.httpserver',
        'jdk.unsupported'
]
def rawProjectVersion = project.version.toString()
def appVersion = rawProjectVersion.replaceAll(/-SNAPSHOT$/, '')
def mainJarName = "${project.name}-${project.version}.jar"

tasks.named('processResources') {
    inputs.property('secureLanVersion', appVersion)
    filesMatching('securelan-version.properties') {
        expand(secureLanVersion: appVersion)
    }
}

def packageInputDir = layout.buildDirectory.dir('package-input')
def packageOutputDir = layout.buildDirectory.dir('packaging')
def installerOutputDir = layout.buildDirectory.dir('packaging/installers')
def desktopPlatform = rootProject.ext.desktopPlatform
def appImageName = desktopPlatform.os == 'macos' ? "${appName}.app".toString() : appName
def appImageDir = packageOutputDir.map { it.dir(appImageName) }
def packagingLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(25)
}
def jpackageExecutable = packagingLauncher.map {
    it.metadata.installationPath.file("bin/jpackage${desktopPlatform.os == 'windows' ? '.exe' : ''}")
}
def packageIconExtension = desktopPlatform.os == 'windows' ? 'ico' : desktopPlatform.os == 'macos' ? 'icns' : 'png'
def packageIconFile = layout.buildDirectory.file("package-icon/app-icon.${packageIconExtension}")
def packageIconSources = desktopPlatform.os == 'macos' ? [16, 32, 128, 256, 512].collect {
    file("src/main/resources/icons/app-icon-${it}.png")
} : [file(desktopPlatform.os == 'windows' ?
        'src/main/resources/icons/app-icon.ico' : 'src/main/resources/icons/app-icon-512.png')]

tasks.register('preparePackageIcon') {
    inputs.files(packageIconSources)
    outputs.file(packageIconFile)
    doLast {
        def target = packageIconFile.get().asFile
        mkdir(target.parentFile)
        if (desktopPlatform.os == 'macos') {
            // ICNS embeds the existing PNGs; no platform tool or image resampling is needed.
            def types = ['icp4', 'icp5', 'ic07', 'ic08', 'ic09']
            def entries = packageIconSources.withIndex().collect { source, index ->
                [type: types[index], data: Files.readAllBytes(source.toPath())]
            }
            target.withDataOutputStream { stream ->
                stream.writeBytes('icns')
                stream.writeInt(8 + entries.sum { it.data.length + 8 })
                entries.each { entry ->
                    stream.writeBytes(entry.type)
                    stream.writeInt(entry.data.length + 8)
                    stream.write(entry.data)
                }
            }
        } else {
            Files.copy(packageIconSources.first().toPath(), target.toPath(), StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

def proguardMainJarName = "${project.name}-${project.version}-proguard.jar"
def proguardOutputJar = layout.buildDirectory.file("libs/${proguardMainJarName}")
def proguardReportsDir = layout.buildDirectory.dir('reports/proguard')
def proguardPackageInputDir = layout.buildDirectory.dir('proguard-package-input')
def proguardPackageOutputDir = layout.buildDirectory.dir('proguard-packaging')
def proguardAppImageDir = proguardPackageOutputDir.map { it.dir(appImageName) }

def sanitizePackageFilePart = { String value ->
    value.replaceAll(/[^A-Za-z0-9_.-]/, '-')
}

def runtimeArtifactFileName = { artifact ->
    def id = artifact.moduleVersion.id
    def classifier = artifact.classifier ? "-${sanitizePackageFilePart(artifact.classifier)}" : ''
    "${sanitizePackageFilePart(id.group)}-${sanitizePackageFilePart(artifact.name)}-${sanitizePackageFilePart(id.version)}${classifier}.${artifact.extension}"
}

def prepareJpackageDirectory = {
    def targetDir = packageInputDir.get().asFile
    if (targetDir.exists()) {
        delete(targetDir)
    }
    mkdir(targetDir)

    def mainJarFile = tasks.named('jar').get().archiveFile.get().asFile
    Files.copy(
            mainJarFile.toPath(),
            new File(targetDir, mainJarName).toPath(),
            StandardCopyOption.REPLACE_EXISTING
    )

    configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.each { artifact ->
        Files.copy(
                artifact.file.toPath(),
                new File(targetDir, runtimeArtifactFileName(artifact)).toPath(),
                StandardCopyOption.REPLACE_EXISTING
        )
    }
}

tasks.register('runComposeShell', JavaExec) {
    dependsOn ':modules:webrtc-core:verifyNativePlatform'
    group = 'application'
    description = 'Run the Compose desktop client (compatibility alias for run).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = composeMainClass
    jvmArgs = application.applicationDefaultJvmArgs
}

def runtimeArtifactNames = providers.provider {
    configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.collectEntries {
        [(it.file): runtimeArtifactFileName(it)]
    }
}

distributions.main.contents {
    eachFile { details ->
        def uniqueName = runtimeArtifactNames.get()[details.file]
        if (uniqueName) {
            details.name = uniqueName
        }
    }
}

tasks.named('startScripts') {
    // Generate the launcher classpath from the actual, uniquely named packaged JARs.
    classpath = files(packageInputDir.map { it.asFileTree.matching { include '*.jar' } })
            .builtBy('prepareJpackageInput')
}

['distTar', 'distZip', 'installDist'].each { taskName ->
    tasks.named(taskName) {
        duplicatesStrategy = DuplicatesStrategy.FAIL
    }
}

tasks.named('jar') {
    // jpackage reads the ICO directly from src/main/resources. Only app-icon.png
    // is loaded by the application, so do not ship launcher-only variants in the JAR.
    exclude 'icons/app-icon-*.png', 'icons/app-icon.ico'

    manifest {
        attributes(
                'Main-Class': application.mainClass.get(),
                'Implementation-Version': appVersion
        )
    }
}

tasks.register('prepareJpackageInput') {
    dependsOn ':modules:webrtc-core:verifyNativePlatform'
    dependsOn tasks.named('jar')
    inputs.files(tasks.named('jar'), configurations.runtimeClasspath)
    outputs.dir(packageInputDir)

    doLast {
        prepareJpackageDirectory()
    }
}

tasks.register('createAppImage', Exec) {
    dependsOn tasks.named('prepareJpackageInput')
    dependsOn tasks.named('preparePackageIcon')
    inputs.dir(packageInputDir)
    inputs.file(packageIconFile)
    inputs.property('appVersion', appVersion)
    inputs.property('jvmArgs', application.applicationDefaultJvmArgs)
    outputs.dir(appImageDir)

    doFirst {
        def outDir = packageOutputDir.get().asFile

        if (appImageDir.get().asFile.exists()) {
            delete(appImageDir.get().asFile)
        }
        mkdir(outDir)

        if (!appVersion || appVersion.isBlank()) {
            throw new GradleException('Resolved appVersion is empty.')
        }

        def mainJarFile = new File(packageInputDir.get().asFile, mainJarName)
        if (!mainJarFile.exists()) {
            throw new GradleException("Main jar was not found: ${mainJarFile.absolutePath}")
        }
    }

    commandLine(
            jpackageExecutable.get().asFile.absolutePath,
            '--type', 'app-image',
            '--name', appName,
            '--app-version', appVersion,
            '--input', packageInputDir.get().asFile.absolutePath,
            '--main-jar', mainJarName,
            '--main-class', application.mainClass.get(),
            '--add-modules', appRuntimeModules.join(','),
            '--dest', packageOutputDir.get().asFile.absolutePath,
            '--java-options', application.applicationDefaultJvmArgs.join(' '),
            '--icon', packageIconFile.get().asFile.absolutePath
    )
}

tasks.register('portableDistZip', Zip) {
    dependsOn tasks.named('createAppImage')

    from(appImageDir) {
        if (desktopPlatform.os == 'macos') {
            into(appImageName)
        }
    }
    destinationDirectory.set(layout.buildDirectory.dir('distributions'))
    archiveFileName.set("${appName}-${appVersion}-portable.zip")
}

tasks.register('buildPortable') {
    group = 'distribution'
    description = 'Build the portable ZIP distribution for the Compose desktop client.'
    dependsOn tasks.named('portableDistZip')
}

tasks.register('buildComposePortable') {
    group = 'distribution'
    description = 'Compatibility alias for buildPortable.'
    dependsOn tasks.named('buildPortable')
}

tasks.register('proguardJar', proguard.gradle.ProGuardTask) {
    dependsOn ':modules:webrtc-core:verifyNativePlatform'
    group = 'distribution'
    description = 'Create an experimental shrunk and optimized JAR without obfuscation.'

    dependsOn tasks.named('jar')
    inputs.files(tasks.named('jar'), configurations.runtimeClasspath)
    inputs.file(file('proguard-desktop.pro'))
    outputs.file(proguardOutputJar)
    outputs.dir(proguardReportsDir)

    doFirst {
        def outputFile = proguardOutputJar.get().asFile
        def reportsDir = proguardReportsDir.get().asFile
        delete(outputFile)
        if (reportsDir.exists()) {
            delete(reportsDir)
        }
        mkdir(outputFile.parentFile)
        mkdir(reportsDir)
    }

    def applicationJarFilter = '!module-info.class,!META-INF/versions/**,!META-INF/*.SF,!META-INF/*.RSA,!META-INF/*.DSA'
    def dependencyJarFilter = "${applicationJarFilter},!META-INF/MANIFEST.MF".toString()
    injars(tasks.named('jar').flatMap { it.archiveFile }, filter: applicationJarFilter)
    configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.sort { it.file.absolutePath }.each { artifact ->
        def artifactFilter = dependencyJarFilter
        if (artifact.moduleVersion.id.group == 'org.jetbrains.compose.runtime' && artifact.name == 'runtime-desktop') {
            // This 416-byte Compose compatibility artifact contains a second, empty
            // META-INF/runtime.kotlin_module. Keep the real AndroidX runtime metadata.
            artifactFilter = "${artifactFilter},!META-INF/runtime.kotlin_module".toString()
        }
        injars(artifact.file, filter: artifactFilter)
    }
    outjars(proguardOutputJar)

    def jmodsDir = packagingLauncher.get().metadata.installationPath.dir('jmods').asFile
    if (!jmodsDir.isDirectory()) {
        throw new GradleException("JDK modules directory was not found: ${jmodsDir.absolutePath}")
    }
    fileTree(jmodsDir) {
        include '*.jmod'
    }.files.sort { it.absolutePath }.each { jmod ->
        libraryjars(jmod, jarfilter: '!**.jar', filter: '!module-info.class')
    }

    configuration file('proguard-desktop.pro')
    printusage proguardReportsDir.map { it.file('usage.txt') }
    printseeds proguardReportsDir.map { it.file('seeds.txt') }
    printmapping proguardReportsDir.map { it.file('mapping.txt') }
    printconfiguration proguardReportsDir.map { it.file('configuration.txt') }

    doLast {
        def outputFile = proguardOutputJar.get().asFile
        def requiredResources = [
                'icons/app-icon.png',
                desktopPlatform.skikoLibrary,
                "${desktopPlatform.skikoLibrary}.sha256".toString(),
                desktopPlatform.webrtcLibrary
        ]
        if (desktopPlatform.os == 'windows') {
            requiredResources.add('icudtl.dat')
        }
        def outputZip = new ZipFile(outputFile)
        try {
            def missingResources = requiredResources.findAll { outputZip.getEntry(it) == null }
            if (!missingResources.isEmpty()) {
                throw new GradleException("ProGuard JAR is missing required resources: ${missingResources.join(', ')}")
            }

            def applicationZip = new ZipFile(tasks.named('jar').get().archiveFile.get().asFile)
            try {
                def missingApplicationResources = applicationZip.entries().findAll { entry ->
                    !entry.directory &&
                            !entry.name.endsWith('.class') &&
                            !entry.name.startsWith('META-INF/versions/') &&
                            !(entry.name ==~ /META-INF\/.+\.(SF|RSA|DSA)/) &&
                            outputZip.getEntry(entry.name) == null
                }.collect { it.name }
                if (!missingApplicationResources.isEmpty()) {
                    throw new GradleException("ProGuard JAR is missing application resources: ${missingApplicationResources.join(', ')}")
                }
            } finally {
                applicationZip.close()
            }
        } finally {
            outputZip.close()
        }

        def usageReport = proguardReportsDir.get().file('usage.txt').asFile
        if (!usageReport.isFile() || usageReport.length() == 0L) {
            throw new GradleException('ProGuard usage report is empty; shrinking was not demonstrated.')
        }
    }
}

tasks.register('prepareProguardJpackageInput') {
    group = 'distribution'
    description = 'Prepare an isolated jpackage input directory containing only the ProGuard JAR.'
    dependsOn tasks.named('proguardJar')
    inputs.file(proguardOutputJar)
    outputs.dir(proguardPackageInputDir)

    doLast {
        def targetDir = proguardPackageInputDir.get().asFile
        if (targetDir.exists()) {
            delete(targetDir)
        }
        mkdir(targetDir)

        Files.copy(
                proguardOutputJar.get().asFile.toPath(),
                new File(targetDir, proguardMainJarName).toPath(),
                StandardCopyOption.REPLACE_EXISTING
        )
    }
}

tasks.register('createProguardAppImage', Exec) {
    group = 'distribution'
    description = 'Create an isolated jpackage app-image from the shrunk and optimized JAR.'
    dependsOn tasks.named('prepareProguardJpackageInput')
    dependsOn tasks.named('preparePackageIcon')
    inputs.dir(proguardPackageInputDir)
    inputs.file(packageIconFile)
    inputs.property('appVersion', appVersion)
    inputs.property('jvmArgs', application.applicationDefaultJvmArgs)
    outputs.dir(proguardAppImageDir)

    doFirst {
        def outDir = proguardPackageOutputDir.get().asFile
        if (outDir.exists()) {
            delete(outDir)
        }
        mkdir(outDir)

        def mainJarFile = new File(proguardPackageInputDir.get().asFile, proguardMainJarName)
        if (!mainJarFile.exists()) {
            throw new GradleException("ProGuard JAR was not found: ${mainJarFile.absolutePath}")
        }
    }

    commandLine(
            jpackageExecutable.get().asFile.absolutePath,
            '--type', 'app-image',
            '--name', appName,
            '--app-version', appVersion,
            '--input', proguardPackageInputDir.get().asFile.absolutePath,
            '--main-jar', proguardMainJarName,
            '--main-class', application.mainClass.get(),
            '--add-modules', appRuntimeModules.join(','),
            '--dest', proguardPackageOutputDir.get().asFile.absolutePath,
            '--java-options', application.applicationDefaultJvmArgs.join(' '),
            '--icon', packageIconFile.get().asFile.absolutePath
    )
}

tasks.register('proguardPortableDistZip', Zip) {
    group = 'distribution'
    description = 'Archive the experimental shrunk and optimized app-image as a portable ZIP.'
    dependsOn tasks.named('createProguardAppImage')

    from(proguardAppImageDir) {
        if (desktopPlatform.os == 'macos') {
            into(appImageName)
        }
    }
    destinationDirectory.set(layout.buildDirectory.dir('distributions'))
    archiveFileName.set("${appName}-${appVersion}-proguard-portable.zip")
}

tasks.register('buildProguardPortable') {
    group = 'distribution'
    description = 'Build the experimental shrunk and optimized portable ZIP without obfuscation.'
    dependsOn tasks.named('proguardPortableDistZip')
}

def isWindows = desktopPlatform.os == 'windows'

def wixOnPath = {
    def pathValue = System.getenv('PATH') ?: ''
    def pathEntries = pathValue.split(pathSeparator)

    def hasWix = pathEntries.any { new File(it, 'wix.exe').exists() }
    def hasCandle = pathEntries.any { new File(it, 'candle.exe').exists() }
    def hasLight = pathEntries.any { new File(it, 'light.exe').exists() }

    return hasWix || (hasCandle && hasLight)
}

tasks.register('createExe', Exec) {
    dependsOn tasks.named('prepareJpackageInput')
    dependsOn tasks.named('preparePackageIcon')
    inputs.dir(packageInputDir)
    inputs.file(packageIconFile)
    inputs.property('appVersion', appVersion)
    inputs.property('jvmArgs', application.applicationDefaultJvmArgs)
    outputs.dir(installerOutputDir)

    doFirst {
        if (!isWindows) {
            throw new GradleException('buildExe can only be run on Windows.')
        }
        if (!wixOnPath()) {
            throw new GradleException('WiX Toolset was not found in PATH. Install WiX and make sure wix.exe or candle.exe/light.exe are available.')
        }

        def outDir = installerOutputDir.get().asFile
        if (outDir.exists()) {
            delete(outDir)
        }
        mkdir(outDir)

        def mainJarFile = new File(packageInputDir.get().asFile, mainJarName)
        if (!mainJarFile.exists()) {
            throw new GradleException("Main jar was not found: ${mainJarFile.absolutePath}")
        }
    }

    commandLine(
            jpackageExecutable.get().asFile.absolutePath,
            '--type', 'exe',
            '--name', appName,
            '--app-version', appVersion,
            '--input', packageInputDir.get().asFile.absolutePath,
            '--main-jar', mainJarName,
            '--main-class', application.mainClass.get(),
            '--add-modules', appRuntimeModules.join(','),
            '--dest', installerOutputDir.get().asFile.absolutePath,
            '--java-options', application.applicationDefaultJvmArgs.join(' '),
            '--icon', packageIconFile.get().asFile.absolutePath,
            '--win-menu',
            '--win-shortcut',
            '--win-dir-chooser'
    )
}

tasks.register('buildExe') {
    group = 'distribution'
    description = 'Build the Windows EXE installer for the Compose desktop client.'
    dependsOn tasks.named('createExe')
}

['createAppImage', 'createProguardAppImage', 'createExe'].each { taskName ->
    tasks.named(taskName) {
        inputs.property('jpackageJdk', packagingLauncher.map { it.metadata.javaRuntimeVersion })
        inputs.property('runtimeModules', appRuntimeModules)
        inputs.property('mainClass', application.mainClass)
    }
}
