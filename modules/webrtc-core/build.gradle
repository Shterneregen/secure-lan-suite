plugins {
    id 'org.jetbrains.kotlin.jvm'
}

def nativeClassifier = rootProject.ext.desktopPlatform.classifier

dependencies {
    api project(':modules:common-model')
    implementation('dev.onvoid.webrtc:webrtc-java:0.14.0') {
        // The POM's self-dependency must not select a second native platform.
        exclude group: 'dev.onvoid.webrtc', module: 'webrtc-java'
    }
    if (nativeClassifier) {
        runtimeOnly("dev.onvoid.webrtc:webrtc-java:0.14.0:${nativeClassifier}") {
            transitive = false
        }
    }
}

tasks.register('verifyNativePlatform') {
    doLast {
        if (!nativeClassifier) {
            throw new GradleException('Unsupported desktop native platform. Use Windows x64, Linux x64/ARM64 or macOS x64/ARM64.')
        }
    }
}

tasks.withType(Test).configureEach {
    dependsOn tasks.named('verifyNativePlatform')
}
