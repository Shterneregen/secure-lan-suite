// Keep WebRTC, packaging and resource validation on the same native platform.
ext.resolveDesktopPlatform = { String osName, String architecture ->
    def os = osName.toLowerCase(Locale.ROOT)
    def arch = architecture.toLowerCase(Locale.ROOT)
    def platformOs = os.contains('windows') ? 'windows' :
            os.contains('mac') || os.contains('darwin') ? 'macos' :
                    os.contains('linux') ? 'linux' : null
    def platformArch = arch in ['amd64', 'x86_64', 'x64'] ? 'x86_64' :
            arch in ['aarch64', 'arm64'] ? 'aarch64' : null
    def supported = platformOs && platformArch &&
            !(platformOs == 'windows' && platformArch == 'aarch64')
    def skikoArch = platformArch == 'x86_64' ? 'x64' : 'arm64'
    def nativeExtension = platformOs == 'windows' ? 'dll' : platformOs == 'macos' ? 'dylib' : 'so'
    def nativePrefix = platformOs == 'windows' ? '' : 'lib'
    [
            os: platformOs,
            classifier: supported ? "${platformOs}-${platformArch}".toString() : null,
            skikoLibrary: "${nativePrefix}skiko-${platformOs}-${skikoArch}.${nativeExtension}".toString(),
            webrtcLibrary: "${nativePrefix}webrtc-java-${platformOs}-${platformArch}.${nativeExtension}".toString()
    ]
}

ext.desktopPlatform = resolveDesktopPlatform(System.getProperty('os.name'), System.getProperty('os.arch'))

// Resolve other host graphs for reviewed lock/checksum updates without cross-building.
def dependencyTarget = providers.gradleProperty('secureLanDependencyTarget').orNull
if (dependencyTarget) {
    if (!gradle.startParameter.taskNames.every { it.tokenize(':').last() == 'resolveDependencyInventory' }) {
        throw new GradleException('secureLanDependencyTarget is only supported by resolveDependencyInventory.')
    }
    if (!(dependencyTarget in ['windows-x86_64', 'linux-x86_64', 'linux-aarch64', 'macos-x86_64', 'macos-aarch64'])) {
        throw new GradleException('Unsupported dependency inventory target.')
    }
    def parts = dependencyTarget.split('-', 2)
    ext.desktopPlatform = resolveDesktopPlatform(parts[0] == 'macos' ? 'Mac OS X' : parts[0], parts[1])
}
