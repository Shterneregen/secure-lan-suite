plugins {
    id 'base'
    id 'com.android.application' apply false
    id 'org.jetbrains.kotlin.jvm' apply false
    id 'org.jetbrains.kotlin.plugin.compose' apply false
    id 'org.jetbrains.compose' apply false
}

apply from: 'gradle/desktop-platform.gradle'

allprojects {
    group = 'com.shterneregen.securelan'
    version = providers.gradleProperty('secureLanVersion').get()

    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    if (path != ':apps:android-client') {
        apply plugin: 'java-library'

        def androidSharedModules = [
                ':modules:common-model', ':modules:common-net', ':modules:crypto-core',
                ':modules:chat-core', ':modules:file-transfer-core'
        ]
        def targetJavaVersion = path in androidSharedModules ? 17 : 25

        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(targetJavaVersion)
            }
        }

        tasks.withType(JavaCompile).configureEach {
            options.release = targetJavaVersion
            options.encoding = 'UTF-8'
        }

        plugins.withId('org.jetbrains.kotlin.jvm') {
            kotlin {
                jvmToolchain(targetJavaVersion)
            }

            tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                compilerOptions {
                    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(targetJavaVersion.toString())
                }
            }
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
        }

        dependencies {
            testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        }
    }
}
