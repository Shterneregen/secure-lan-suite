buildscript {
    // Build tools have their own dependency graph; these do not change application crypto.
    configurations.classpath {
        resolutionStrategy.eachDependency {
            if (requested.group == 'org.bouncycastle') useVersion '1.86'
            if (requested.group == 'org.apache.commons' && requested.name == 'commons-lang3') useVersion '3.18.0'
            if (requested.group == 'org.bitbucket.b_c' && requested.name == 'jose4j') useVersion '0.9.6'
            if (requested.group == 'org.jdom' && requested.name == 'jdom2') useVersion '2.0.6.1'
        }
    }
}

plugins {
    id 'base'
    id 'com.android.application' apply false
    id 'org.jetbrains.kotlin.jvm' apply false
    id 'org.jetbrains.kotlin.plugin.compose' apply false
    id 'org.jetbrains.compose' apply false
}

apply from: 'gradle/desktop-platform.gradle'
apply from: 'gradle/verification.gradle'

allprojects {
    group = 'com.shterneregen.securelan'
    version = providers.gradleProperty('secureLanVersion').get()

    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    if (buildFile.isFile() && path != ':apps:android-client') {
        apply plugin: 'java-library'

        def androidSharedModules = [
                ':modules:common-model', ':modules:common-net', ':modules:crypto-core',
                ':modules:chat-core', ':modules:file-transfer-core'
        ]
        def targetJavaVersion = path in androidSharedModules ? 17 : 25

        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(targetJavaVersion)
            }
        }

        tasks.withType(JavaCompile).configureEach {
            options.release = targetJavaVersion
            options.encoding = 'UTF-8'
        }

        plugins.withId('org.jetbrains.kotlin.jvm') {
            kotlin {
                jvmToolchain(targetJavaVersion)
            }

            tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                compilerOptions {
                    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(targetJavaVersion.toString())
                }
            }
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
        }

        dependencies {
            testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        }
    }
}
